name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Python, Node and .NET are preinstalled on GitHub's ubuntu runners
      - name: Vote (Python) - install dependencies and compile
        run: |
          pip install -r vote/requirements.txt
          python -m py_compile vote/app.py

      - name: Result (Node) - install dependencies and syntax check
        working-directory: result
        run: |
          npm ci
          node --check server.js

      - name: Worker (.NET) - build
        run: dotnet build worker/Worker.csproj -c Release

  build-scan-push:
    name: Build, scan, push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v6

      # ghcr.io image names must be lowercase (HupHOP -> huphop)
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voting-app-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ github.sha }}

      - name: Build image (kept local for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Pinned to the commit of v0.35.0 (the safe release after the March 2026
      # supply chain attack). Do not switch this back to a version tag.
      - name: Trivy report (HIGH and CRITICAL, never fails the build)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.69.3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy gate (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.69.3
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with the commit SHA)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
