name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Python, Node and .NET are preinstalled on GitHub's ubuntu runners
      - name: Vote (Python) - install dependencies and compile
        run: |
          pip install -r vote/requirements.txt
          python -m py_compile vote/app.py

      - name: Result (Node) - install dependencies and syntax check
        working-directory: result
        run: |
          npm ci
          node --check server.js

      - name: Worker (.NET) - build
        run: dotnet build worker/Worker.csproj -c Release

  build-scan-push:
    name: Build, scan, push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v6

      # ghcr.io image names must be lowercase (HupHOP -> huphop)
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voting-app-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ github.sha }}

      - name: Build image (kept local for scanning)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Pinned to the commit of v0.35.0 (the safe release after the March 2026
      # supply chain attack). Do not switch this back to a version tag.
      - name: Trivy report (HIGH and CRITICAL, never fails the build)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.69.3
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy gate (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.69.3
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with the commit SHA)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy:
    name: Deploy to a temporary kind cluster
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # kind, kubectl and helm are preinstalled on the GitHub runner image
      - name: Tool versions
        run: |
          kind version
          kubectl version --client
          helm version

      - name: Create a temporary kind cluster
        run: kind create cluster --name ci --wait 120s

      - name: Deploy the Helm chart with the image tag that was just pushed
        run: |
          helm upgrade --install voting-app charts/voting-app \
            --namespace voting --create-namespace \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Smoke test - cast a vote and check it reaches the database
        run: |
          set -euo pipefail
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

          kubectl get pods -n voting
          kubectl port-forward -n voting svc/vote 8080:5000 > /tmp/pf-vote.log 2>&1 &
          kubectl port-forward -n voting svc/result 8081:5001 > /tmp/pf-result.log 2>&1 &
          sleep 5

          echo "Vote page:"
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/
          echo "Result page:"
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8081/

          echo "Casting a vote"
          curl -fsS -o /dev/null -w "%{http_code}\n" -X POST -d "vote=a" http://localhost:8080/

          echo "Waiting for the worker to move the vote into the database"
          for i in $(seq 1 30); do
            count=$(kubectl exec -n voting deploy/db -- psql -U postgres -tAc "SELECT count(*) FROM votes" 2>/dev/null || echo 0)
            echo "votes in database: ${count:-0}"
            if [ "${count:-0}" -ge 1 ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: the vote never reached the database"
          exit 1

      - name: Diagnostics (only on failure)
        if: failure()
        run: |
          kubectl get pods -n voting -o wide || true
          kubectl describe pods -n voting || true
          for app in vote result worker redis db; do
            echo "== logs: $app =="
            kubectl logs -n voting -l app=$app --tail=40 || true
          done

      - name: Delete the temporary cluster
        if: always()
        run: kind delete cluster --name ci || true
