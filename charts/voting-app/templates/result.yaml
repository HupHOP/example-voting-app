apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      securityContext:
        sysctls:
          # the image runs as a non-root user but listens on port 80
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: result
          image: {{ include "voting-app.image" (dict "root" . "name" "result" "tag" .Values.result.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.result.runAsUser }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
spec:
  type: NodePort
  selector:
    app: result
  ports:
    - port: 5001
      targetPort: 80
      nodePort: {{ .Values.result.nodePort }}
