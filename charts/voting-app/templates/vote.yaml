apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
spec:
  replicas: {{ .Values.vote.replicas }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      securityContext:
        sysctls:
          # the image runs as a non-root user but listens on port 80
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: vote
          image: {{ include "voting-app.image" (dict "root" . "name" "vote" "tag" .Values.vote.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.vote.runAsUser }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
spec:
  type: NodePort
  selector:
    app: vote
  ports:
    - port: 5000
      targetPort: 80
      nodePort: {{ .Values.vote.nodePort }}
